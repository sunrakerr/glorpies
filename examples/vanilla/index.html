<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glorpies · Vanilla example</title>
  </head>
  <body>
    <main>
      <h1>Meet your Glorpie</h1>
      <p>Same name. Same face. Every time.</p>
      <div class="face">
        <glorpie-face
          name="sunrakerrisfriednoodlz"
          look="watercolour"
          size="192"
          pokeable
          label="An alien avatar for sunrakerrisfriednoodlz"
        ></glorpie-face>
      </div>
      <label>Name<input id="name" value="sunrakerrisfriednoodlz" /></label>
      <label
        >Look<select id="look">
          <option>watercolour</option>
          <option>gouache</option>
          <option>sticker</option>
          <option>ink</option>
        </select></label
      >
      <a href="https://glorpies.sunrakerr.dev/docs/html">HTML & JavaScript documentation →</a>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
