name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format:check && pnpm readme:check

  library:
    name: library on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter glorpies typecheck
      - name: build and test
        run: pnpm test
      - name: the framework components in a real browser
        if: matrix.node == 26
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
      - name: test the framework components
        if: matrix.node == 26
        run: pnpm --filter glorpies test:browser
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - name: lint the package as npm will see it
        run: pnpm --filter glorpies lint:package
      - name: install the packed package the way a user would, and use it
        run: pnpm --filter glorpies test:packed

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  examples:
    name: ${{ matrix.example }} starter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [react, vanilla]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: examples/${{ matrix.example }}/package-lock.json
      - run: npm ci
        working-directory: examples/${{ matrix.example }}
      - run: npm run build
        working-directory: examples/${{ matrix.example }}
