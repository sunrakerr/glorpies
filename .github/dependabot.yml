version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
      site:
        dependency-type: production
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 ships no compiler API, which tsup needs to bundle the library's type declarations
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /examples/react
    schedule:
      interval: weekly
    ignore:
      - dependency-name: glorpies
  - package-ecosystem: npm
    directory: /examples/vanilla
    schedule:
      interval: weekly
    ignore:
      - dependency-name: glorpies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
