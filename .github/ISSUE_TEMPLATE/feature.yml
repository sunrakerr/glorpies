name: feature request
description: suggest an improvement to glorpies
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: what problem would this solve?
      description: Describe the use case and what you cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: proposed change
      description: Include an API example if helpful, and any alternatives you considered.
    validations:
      required: true
