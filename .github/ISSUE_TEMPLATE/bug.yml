name: a glorpie misbehaves
description: something broke, or a face came out wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: what happened
      description: what you did, what you expected, and what you got instead. A screenshot helps.
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: the face
      description: the name (and look, size, state) of a face that shows it, if it's about a face
      placeholder: 'agent-47, look=ink, size=32'
  - type: input
    id: where
    attributes:
      label: where
      description: glorpies version, and the entry (react, element, server, cli) and browser or runtime
      placeholder: 'glorpies 0.1.1, glorpies/react, Chrome, Node 26'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: minimal reproduction
      description: A small code example or repository link, plus the commands or steps to reproduce it. Remove private data and credentials.
    validations:
      required: true
